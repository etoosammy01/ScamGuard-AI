name: Foundation CI
on:
  push:
    branches: [main, feature/phase-1-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scamguard
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: scamguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scamguard -d scamguard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://scamguard:ci_only_password@localhost:5432/scamguard?sslmode=disable
      TEST_DATABASE_URL: postgres://scamguard:ci_only_password@localhost:5432/scamguard?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run ./cmd/migrate up
      - run: go run ./cmd/migrate up
      - run: go test -race ./...
      - run: go run ./cmd/migrate down
      - run: go run ./cmd/migrate up
      - run: go build ./cmd/server
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
